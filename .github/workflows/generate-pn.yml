name: Generate PN File

on:
  issues:
    types: [opened]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  generate:
    if: contains(github.event.issue.labels.*.name, 'pn-request')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install openpyxl

      - name: Parse issue form
        id: issue-parser
        uses: stefanbuck/github-issue-parser@v3
        with:
          template-path: .github/ISSUE_TEMPLATE/pn-request.yml

      - name: Generate / update xlsx
        run: |
          python scripts/generate_pn.py "${HOME}/issue-parser-result.json" "${{ github.workspace }}" "${{ github.workspace }}/gen-result.json"

      - name: Load result
        id: result
        run: |
          python - <<'PYEOF'
          import json, os
          with open("gen-result.json", encoding="utf-8") as f:
              data = json.load(f)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              f.write(f"ok={str(data['ok']).lower()}\n")
              f.write(f"model_name={data.get('model_name','')}\n")
              f.write(f"file_path={data.get('file_path','')}\n")
          PYEOF

      - name: Comment errors on issue
        if: steps.result.outputs.ok != 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const data = JSON.parse(fs.readFileSync('gen-result.json', 'utf8'));
            const body = [
              "產生檔案時發現問題，請修正以下項目後，關閉這個 Issue 重新填一次表單：",
              "",
              ...data.errors.map(e => `- ${e}`),
            ].join("\n");
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });

      - name: Create pull request
        if: steps.result.outputs.ok == 'true'
        id: cpr
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "PN 申請：${{ steps.result.outputs.model_name }} (Issue #${{ github.event.issue.number }})"
          branch: "pn-request/issue-${{ github.event.issue.number }}"
          title: "[PN申請] ${{ steps.result.outputs.model_name }}"
          body: |
            由 Issue #${{ github.event.issue.number }} 自動產生，請審核 90/80 編碼內容。

            檔案：`${{ steps.result.outputs.file_path }}`

            確認沒問題後再合併；若 ODM/JDM/Cosign，記得補上 70/60 PN。
          labels: pn-request

      - name: Comment PR link on issue
        if: steps.result.outputs.ok == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: "已建立 PR，請前往審核：" + "${{ steps.cpr.outputs.pull-request-url }}",
            });
