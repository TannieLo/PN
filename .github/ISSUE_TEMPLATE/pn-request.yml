name: "PN 申請 (90/80編碼)"
description: "填寫基本資料，自動產生/更新 90PN_<Model Name>.xlsx"
title: "[PN申請] "
labels: ["pn-request"]
body:
  - type: markdown
    attributes:
      value: "## 基本資料"

  - type: input
    id: model_name
    attributes:
      label: "Model Name"
      placeholder: "GT-AX67"
    validations:
      required: true

  - type: input
    id: project_code
    attributes:
      label: "Project Code（3碼，PLM系統）"
      placeholder: "0AN"
    validations:
      required: true

  - type: dropdown
    id: project_type
    attributes:
      label: "專案類型"
      description: "OEM：70/60 PN 由你在下面「80 PN 分組定義」填寫。ODM/JDM/Cosign：70/60 PN 留空，由審核者在 PR 裡補上。"
      options:
        - "OEM"
        - "ODM"
        - "JDM"
        - "Cosign"
    validations:
      required: true

  - type: dropdown
    id: ems_org
    attributes:
      label: "代工廠 EMS"
      options:
        - "AGP - 智易 Arcadyan_大陸"
        - "AJR - 智易 Arcadyan_台灣"
        - "AR1 - 智易 Arcadyan_越南"
        - "AFL - 訊舟 Acelink_大陸"
        - "AQR - 訊舟 Acelink_台灣"
        - "AWM - 同維/共進_深圳"
        - "AUG - 同維/共進_香港"
        - "AOR - 亞旭 Askey_大陸"
        - "AQH - 亞旭 Askey_台灣"
        - "ATC - 正文_崑山"
        - "AZK - 正文_安博"
        - "AS9 - 正文_越南"
        - "AS3 - 世紀本原"
        - "AK4 - 華芸"
        - "AKM - 啟碁"
        - "AKN - 金磚"
        - "AFW - 晶訊"
        - "AVT - 品威"
        - "AWJ - 東碩_台灣"
        - "AXY - 康全_大陸"
        - "A3C - 偉迪"
        - "AKS - 訊舟 Acelink_大陸(Consign)"
        - "ASI - 訊舟 Acelink_台灣(Consign)"
    validations:
      required: true

  - type: markdown
    attributes:
      value: "## 80 PN 分組定義（最多 5 組）
先定義這次申請會用到的顏色/PCBA/機種分類/出貨數量組合。下面「SKU 申請」區塊裡，每一組 SKU 要指定屬於哪一個分組。沒用到的分組留空即可。"

  - type: markdown
    attributes:
      value: "### 分組 1"

  - type: dropdown
    id: g1_color
    attributes:
      label: "產品顏色 (ID+Color)"
      options:
        - "0 - 不分色"
        - "B - Black"
        - "W - White"
    validations:
      required: false

  - type: dropdown
    id: g1_pcba
    attributes:
      label: "PCBA"
      options:
        - "0 - All SKU 通用 (Default)"
        - "A - PCBA_US"
        - "B - PCBA_EU"
        - "E - EPA"
        - "I - IPA"
    validations:
      required: false

  - type: dropdown
    id: g1_class
    attributes:
      label: "機種分類"
      options:
        - "0 - 不分子母機 (一般 Router/PCE/USB 等)"
        - "R - 子母機 - Router (母機)"
        - "N - 子母機 - Node (子機)"
    validations:
      required: false

  - type: dropdown
    id: g1_pk
    attributes:
      label: "出貨機台數量 (PK)"
      options:
        - "1 - 1pk"
        - "2 - 2pk"
        - "3 - 3pk"
    validations:
      required: false

  - type: input
    id: g1_70pn
    attributes:
      label: "70 PN（OEM 時填）"
      placeholder: "70IG0AN0-SA1000"
    validations:
      required: false

  - type: input
    id: g1_70desc
    attributes:
      label: "70 品規（OEM 時填）"
      placeholder: "XXX SYSTEM ASSY//"
    validations:
      required: false

